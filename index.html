<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Med — клиника для машин</title>
  
  <!-- Подключаем шрифты и иконки -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    :root {
      --blue: #0b5ed7;
      --light: #f4f7fb;
      --dark: #1c1f26;
      --accent: #00c2ff;
      --card: #ffffff;
      --red: #dc3545;
      --green: #28a745;
      --gap: 20px;
      --padding: 30px;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--light);
      color: var(--dark);
      line-height: 1.6;
    }
    
    h1, h2, h3, h4 {
      margin-bottom: var(--gap);
    }
    
    button {
      cursor: pointer;
      border: none;
      outline: none;
    }
    
    /* Header */
    header {
      background: linear-gradient(135deg, var(--blue), var(--accent));
      color: white;
      padding: var(--padding) var(--padding) calc(var(--padding) * 2);
      position: relative;
      text-align: center;
    }
    
    .hero {
      max-width: 900px;
      margin: auto;
    }
    
    .hero h1 {
      font-size: 3em;
      font-weight: 700;
      margin-bottom: 10px;
    }
    
    .hero p {
      font-size: 1.2em;
      opacity: 0.9;
      max-width: 600px;
      margin: 0 auto;
    }
    
    /* Top Banner */
    .top-banner {
      background: #ffb703;
      color: #000;
      text-align: center;
      padding: 12px;
      font-weight: 600;
      font-size: 0.9em;
    }
    
    /* Sections */
    .section {
      max-width: 1200px;
      margin: var(--gap) auto;
      padding: 0 var(--padding);
    }
    
    .section h2 {
      font-size: 2.2em;
      text-align: center;
      margin-bottom: calc(var(--gap) * 1.5);
      color: var(--blue);
    }
    
    /* Check Car Card */
    .check-card {
      background: var(--card);
      border-radius: 18px;
      padding: var(--padding);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      text-align: center;
      max-width: 600px;
      margin: 0 auto;
    }
    
    .check-card input {
      padding: 14px;
      width: 260px;
      font-size: 1em;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin: 10px 5px;
    }
    
    .check-card button {
      background: var(--blue);
      color: white;
      padding: 14px 25px;
      border-radius: 10px;
      font-size: 1em;
      transition: all 0.3s ease;
    }
    
    .check-card button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
    
    /* Medical Card */
    .medical-card {
      background: var(--card);
      border-radius: 20px;
      padding: var(--padding);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      display: none;
    }
    
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--gap);
      border-bottom: 2px solid var(--light);
      padding-bottom: 10px;
    }
    
    .card-header h2 {
      color: var(--blue);
    }
    
    .status {
      padding: 8px 16px;
      border-radius: 50px;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8em;
    }
    
    .status.active {
      background: var(--green);
      color: white;
    }
    
    .vital-signs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--gap);
      margin-bottom: var(--gap);
    }
    
    .sign {
      text-align: center;
      padding: 15px;
      background: var(--light);
      border-radius: 12px;
    }
    
    .sign .icon {
      font-size: 1.8em;
      margin-bottom: 8px;
    }
    
    .sign .label {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 4px;
    }
    
    .sign .value {
      font-weight: 700;
      font-size: 1.1em;
    }
    
    /* Health Graph */
    #healthChart {
      height: 300px;
      margin: var(--gap) 0;
    }
    
    /* Visits History */
    .visits-history {
      margin-top: var(--gap);
    }
    
    .visit {
      border-left: 4px solid var(--blue);
      padding: 10px 15px;
      margin-bottom: var(--gap);
      background: var(--light);
      border-radius: 0 8px 8px 0;
    }
    
    .visit h4 {
      margin: 0 0 5px 0;
      color: var(--blue);
    }
    
    .visit .date {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 8px;
    }
    
    .visit .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    
    .detail {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .detail i {
      color: var(--blue);
      font-size: 0.9em;
    }
    
    /* Points System */
    .points-system {
      background: var(--card);
      border-radius: 20px;
      padding: var(--padding);
      margin: var(--gap) 0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

      display
